<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBBSE Class 8 Science MCQ Quiz App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            text-align: center;
        }
        header h1 {
            font-size: 1.4rem;
            color: #38bdf8;
            width: 100%;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 90%;
        }
        .chapter-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 1rem;
        }
        .chapter-btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 12px 16px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .chapter-btn:hover {
            background-color: #0284c7;
        }
        .set-selection {
            display: none;
            text-align: center;
        }
        .set-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 1.5rem;
        }
        .set-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .set-btn:hover {
            background-color: #0369a1;
        }
        .quiz-box {
            display: none;
        }
        .question {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #38bdf8;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .option-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #475569;
        }
        .option-btn.correct {
            background-color: #16a34a !important;
            border-color: #15803d;
        }
        .option-btn.wrong {
            background-color: #dc2626 !important;
            border-color: #b91c1c;
        }
        .back-btn, .next-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .back-btn:hover, .next-btn:hover {
            background-color: #0369a1;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 WBBSE ক্লাস ৮ বিজ্ঞান MCQ কুইজ অ্যাপ (১১টি অধ্যায় ও ৩টি সেট)</h1>
    </header>

    <div class="container" id="mainContainer">
        <!-- 1. Chapter Selection -->
        <div id="chapterSelection">
            <h2 style="margin-bottom: 1rem; color: #f1f5f9; font-size: 1.2rem;">একটি অধ্যায় নির্বাচন করুন:</h2>
            <div class="chapter-list" id="chapterList"></div>
        </div>

        <!-- 2. Set Selection -->
        <div class="set-selection" id="setSelection">
            <h2 id="selectedChapterTitle" style="color: #38bdf8; margin-bottom: 1rem;"></h2>
            <p style="color: #cbd5e1;">অনুগ্রহ করে যেকোনো একটি প্রশ্ন সেট বেছে নিন (প্রতি সেটে ২০টি করে প্রশ্ন থাকবে):</p>
            <div class="set-buttons">
                <button class="set-btn" onclick="startSet(1)">সেট ১ (Set 1)</button>
                <button class="set-btn" onclick="startSet(2)">সেট ২ (Set 2)</button>
                <button class="set-btn" onclick="startSet(3)">সেট ৩ (Set 3)</button>
            </div>
            <br><br>
            <button class="back-btn" onclick="goBackToChapters()">← সব অধ্যায়ের তালিকায় ফিরুন</button>
        </div>

        <!-- 3. Quiz Box -->
        <div class="quiz-box" id="quizBox">
            <div class="flex-between" style="margin-bottom: 1.5rem;">
                <h3 id="quizTitle" style="color: #cbd5e1; font-size: 1rem;"></h3>
                <button class="back-btn" onclick="goBackToSets()">← সেট নির্বাচনে ফিরুন</button>
            </div>
            <div id="questionContainer">
                <div class="question" id="questionText">প্রশ্ন এখানে আসবে</div>
                <div class="options" id="optionsContainer"></div>
            </div>
            <div class="flex-between">
                <span id="scoreTracker" style="font-weight: bold; color: #38bdf8;">স্কোর: ০</span>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">পরবর্তী প্রশ্ন →</button>
            </div>
        </div>
    </div>

    <script>
        const chapters = [
            { id: 1, name: "১ম অধ্যায়: ভৌত পরিবেশ (বল ও চাপ, স্পর্শ ছাড়া ক্রিয়াশীল বল, তাপ এবং আলো)" },
            { id: 2, name: "২য় অধ্যায়: মৌল, যৌগ ও রাসায়নিক বিক্রিয়া (পদার্থের প্রকৃতি ও গঠন, রাসায়নিক বিক্রিয়া এবং তড়িতের রাসায়নিক প্রভাব)" },
            { id: 3, name: "৩য় অধ্যায়: কয়েকটি গ্যাসের পরিচিতি" },
            { id: 4, name: "৪র্থ অধ্যায়: প্রকৃতি ও জীবজগতে কার্বন যৌগ" },
            { id: 5, name: "৫ম অধ্যায়: প্রাকৃতিক ঘটনা ও তার বিশ্লেষণ" },
            { id: 6, name: "৬ষ্ঠ অধ্যায়: জীবদেহের গঠন" },
            { id: 7, name: "৭ম অধ্যায়: অণুজীবের জগৎ" },
            { id: 8, name: "৮ম অধ্যায়: মানুষের খাদ্য ও খাদ্য উৎপাদন" },
            { id: 9, name: "৯ম অধ্যায়: অন্তঃক্ষরা গ্রন্থি ও বয়ঃসন্ধি" },
            { id: 10, name: "১০ম অধ্যায়: জীববৈচিত্র্য, পরিবেশের সংকট ও বিপন্ন প্রাণীর সংরক্ষণ" },
            { id: 11, name: "১১শ অধ্যায়: আমাদের চারপাশের পরিবেশ ও উদ্ভিদজগৎ" }
        ];

        // Generator function to create 20 dummy/sample MCQ items per set for demonstration
        function generateQuestions(chapId, setId) {
            let questions = [];
            for(let i = 1; i <= 20; i++) {
                questions.push({
                    q: `[অধ্যায় ${chapId} - সেট ${setId}] প্রশ্ন নং ${i}: এই প্রশ্নটি WBBSE ক্লাস ৮ এর সিলেবাস অনুযায়ী নির্ধারিত হয়েছে। সঠিক বিকল্পটি নির্বাচন করুন।`,
                    options: [
                        `বিকল্প ক (সঠিক উত্তর)`,
                        `বিকল্প খ`,
                        `বিকল্প গ`,
                        `বিকল্প ঘ`
                    ],
                    answer: 0
                });
            }
            return questions;
        }

        let selectedChapterId = null;
        let selectedChapterName = "";
        let currentSetQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const chapterListEl = document.getElementById('chapterList');
        const chapterSelectionEl = document.getElementById('chapterSelection');
        const setSelectionEl = document.getElementById('setSelection');
        const selectedChapterTitleEl = document.getElementById('selectedChapterTitle');
        const quizBoxEl = document.getElementById('quizBox');
        const quizTitleEl = document.getElementById('quizTitle');
        const questionTextEl = document.getElementById('questionText');
        const optionsContainerEl = document.getElementById('optionsContainer');
        const scoreTrackerEl = document.getElementById('scoreTracker');
        const nextBtnEl = document.getElementById('nextBtn');

        function init() {
            chapterListEl.innerHTML = '';
            chapters.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.innerText = ch.name;
                btn.onclick = () => selectChapter(ch.id, ch.name);
                chapterListEl.appendChild(btn);
            });
        }

        function selectChapter(id, name) {
            selectedChapterId = id;
            selectedChapterName = name;
            selectedChapterTitleEl.innerText = name;
            chapterSelectionEl.style.display = 'none';
            setSelectionEl.style.display = 'block';
        }

        function startSet(setId) {
            currentSetQuestions = generateQuestions(selectedChapterId, setId);
            currentQuestionIndex = 0;
            score = 0;
            setSelectionEl.style.display = 'none';
            quizBoxEl.style.display = 'block';
            quizTitleEl.innerText = `${selectedChapterName} - সেট ${setId}`;
            loadQuestion();
        }

        function loadQuestion() {
            nextBtnEl.style.display = 'none';
            const qData = currentSetQuestions[currentQuestionIndex];
            questionTextEl.innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
            optionsContainerEl.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const optBtn = document.createElement('button');
                optBtn.className = 'option-btn';
                optBtn.innerText = opt;
                optBtn.onclick = () => selectOption(idx, qData.answer, optBtn);
                optionsContainerEl.appendChild(optBtn);
            });
            scoreTrackerEl.innerText = `স্কোর: ${score}`;
        }

        function selectOption(selectedIndex, correctIndex, selectedBtn) {
            const allButtons = optionsContainerEl.getElementsByClassName('option-btn');
            for(let btn of allButtons) {
                btn.disabled = true;
            }

            if(selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                score++;
            } else {
                selectedBtn.classList.add('wrong');
                allButtons[correctIndex].classList.add('correct');
            }
            scoreTrackerEl.innerText = `স্কোর: ${score}`;
            nextBtnEl.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if(currentQuestionIndex < currentSetQuestions.length) {
                loadQuestion();
            } else {
                questionTextEl.innerHTML = `🎉 অভিনন্দন! কুইজ সম্পন্ন হয়েছে। আপনার মোট স্কোর: ${score} / ${currentSetQuestions.length}`;
                optionsContainerEl.innerHTML = '';
                nextBtnEl.style.display = 'none';
            }
        }

        function goBackToChapters() {
            setSelectionEl.style.display = 'none';
            chapterSelectionEl.style.display = 'block';
        }

        function goBackToSets() {
            quizBoxEl.style.display = 'none';
            setSelectionEl.style.display = 'block';
        }

        init();
    </script>
</body>
</html>
