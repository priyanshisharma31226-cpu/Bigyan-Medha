
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5636c9">
<title>বিজ্ঞান মেধা | Class 8</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f0ff;
  color:#292344;
}
header{
  background:linear-gradient(135deg,#5636c9,#8b5cf6);
  color:white;
  text-align:center;
  padding:25px 15px;
  border-radius:0 0 25px 25px;
}
header h1{margin:0;font-size:29px}
header p{margin:8px 0 0}
.container{max-width:650px;margin:20px auto;padding:0 14px}
.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px #34216a12;
}
h2{font-size:20px;margin:0 0 15px}
label{display:block;font-weight:bold;margin:13px 0 7px}
select{
  width:100%;
  padding:13px;
  border:1px solid #d8d0f4;
  border-radius:10px;
  font-size:16px;
  background:white;
  color:#292344;
}
button{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#6845dc;color:white;width:100%;margin-top:16px}
.secondary{background:#eee9ff;color:#5636c9}
.option{
  display:block;
  width:100%;
  text-align:left;
  margin:10px 0;
  background:#f5f2ff;
  color:#30264d;
  border:2px solid transparent;
}
.option:disabled{opacity:1}
.option.correct{background:#e2f8e9;border-color:#20a45a;color:#126b35}
.option.wrong{background:#ffe8e8;border-color:#e04b4b;color:#a51e1e}
.small{font-size:13px;color:#746c89}
.progress{
  height:9px;background:#eee9ff;border-radius:20px;overflow:hidden;
  margin:12px 0;
}
.progress div{height:100%;background:#7652e8;width:0%}
#quiz,#result{display:none}
#feedback{padding:12px;border-radius:10px;margin-top:12px;display:none}
#feedback.good{background:#e5f8eb;color:#176b36}
#feedback.bad{background:#fff0e9;color:#9b3b19}
footer{text-align:center;padding:20px;color:#827b96;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>🔬 বিজ্ঞান মেধা</h1>
  <p>WBBSE Class 8 | পরিবেশ ও বিজ্ঞান</p>
  <p>শিখি • অনুশীলন করি • সফল হই</p>
</header>

<main class="container">

<section class="card" id="home">
  <h2>📚 অনুশীলন শুরু করো</h2>

  <label for="chapter">অধ্যায় নির্বাচন করো</label>
  <select id="chapter">
    <option value="all">সব অধ্যায়</option>
    <option value="force">বল ও চাপ</option>
    <option value="noncontact">স্পর্শ ছাড়া ক্রিয়াশীল বল</option>
    <option value="heat">তাপ</option>
    <option value="light">আলো</option>
  </select>

  <label for="model">প্রশ্নের মডেল নির্বাচন করো</label>
  <select id="model">
    <option value="all">সব ধরনের প্রশ্ন</option>
    <option value="WBBSE">WBBSE Model</option>
    <option value="RM">Roy & Martin Model</option>
  </select>

  <button class="primary" onclick="startQuiz()">🚀 পরীক্ষা শুরু করো</button>
  <p class="small">এটি প্রাথমিক নমুনা প্রশ্নব্যাংক। আরও অধ্যায় ও প্রশ্ন ধাপে ধাপে যোগ হবে।</p>
</section>

<section class="card" id="quiz">
  <div class="small" id="modelName"></div>
  <div class="progress"><div id="bar"></div></div>
  <p class="small" id="counter"></p>
  <h2 id="question"></h2>
  <div id="options"></div>
  <div id="feedback"></div>
  <button class="secondary" id="next" onclick="nextQuestion()" style="display:none;width:100%;margin-top:15px">পরের প্রশ্ন →</button>
  <button class="secondary" onclick="speakQuestion()" style="margin-top:12px">🔊 প্রশ্ন শুনি</button>
</section>

<section class="card" id="result">
  <h2>🎉 পরীক্ষা শেষ!</h2>
  <h1 id="score" style="color:#6845dc"></h1>
  <p id="message"></p>
  <button class="primary" onclick="startQuiz()">আবার পরীক্ষা দাও</button>
  <button class="secondary" onclick="goHome()" style="width:100%;margin-top:10px">অন্য অধ্যায় বেছে নাও</button>
</section>

</main>

<footer>বিজ্ঞান মেধা • Class 8 Learning App</footer>

<script>
const questions = [

{
 chapter:"force", model:"WBBSE",
 q:"কোনো বস্তুর উপর বল প্রয়োগ করলে তার কী পরিবর্তন হতে পারে?",
 options:["শুধু রং পরিবর্তন","গতির বা আকারের পরিবর্তন","শুধু ভর পরিবর্তন","কোনো পরিবর্তন হয় না"],
 answer:1,
 explain:"বল প্রয়োগে বস্তুর গতির অবস্থা, গতির দিক বা আকার পরিবর্তিত হতে পারে।"
},
{
 chapter:"force", model:"RM",
 q:"একটি স্থির ফুটবলকে লাথি মারলে বলটি চলতে শুরু করে। এর প্রধান কারণ কী?",
 options:["ঘর্ষণ","বল প্রয়োগ","তাপ","আলো"],
 answer:1,
 explain:"পায়ের দ্বারা ফুটবলের উপর বল প্রয়োগ করা হয়, তাই বলটি চলতে শুরু করে।"
},
{
 chapter:"noncontact", model:"WBBSE",
 q:"পৃথিবী কোন বলের সাহায্যে বস্তুকে নিজের দিকে টানে?",
 options:["চৌম্বক বল","মহাকর্ষ বল","ঘর্ষণ বল","স্থিতিস্থাপক বল"],
 answer:1,
 explain:"পৃথিবী মহাকর্ষ বলের মাধ্যমে বস্তুকে নিজের কেন্দ্রের দিকে আকর্ষণ করে।"
},
{
 chapter:"noncontact", model:"RM",
 q:"চুম্বক লোহার পেরেককে স্পর্শ না করেও আকর্ষণ করতে পারে। এটি কোন ধরনের বল?",
 options:["স্পর্শ বল","অস্পর্শ বল","ঘর্ষণ বল","পেশি বল"],
 answer:1,
 explain:"চুম্বকীয় বল স্পর্শ ছাড়াই কাজ করতে পারে, তাই এটি অস্পর্শ বল।"
},
{
 chapter:"heat", model:"WBBSE",
 q:"তাপের SI একক কী?",
 options:["নিউটন","জুল","ওয়াট","পাস্কাল"],
 answer:1,
 explain:"তাপ এক ধরনের শক্তি। শক্তির SI একক জুল।"
},
{
 chapter:"heat", model:"RM",
 q:"তাপ সাধারণত কোন দিক থেকে কোন দিকে প্রবাহিত হয়?",
 options:["ঠান্ডা থেকে গরমে","গরম থেকে ঠান্ডায়","দুই দিকেই সমান","কোনো দিকেই নয়"],
 answer:1,
 explain:"তাপ স্বাভাবিকভাবে বেশি তাপমাত্রার বস্তু থেকে কম তাপমাত্রার বস্তুর দিকে প্রবাহিত হয়।"
},
{
 chapter:"light", model:"WBBSE",
 q:"আলো কোন ধরনের মাধ্যমে চলতে পারে?",
 options:["শুধু কঠিন মাধ্যমে","শুধু তরলে","শূন্যস্থানেও","শুধু গ্যাসে"],
 answer:2,
 explain:"আলো চলার জন্য কোনো বস্তুগত মাধ্যমের প্রয়োজন হয় না। আলো শূন্যস্থানেও চলতে পারে।"
},
{
 chapter:"light", model:"RM",
 q:"সমতল দর্পণে গঠিত প্রতিবিম্ব সাধারণত কেমন হয়?",
 options:["বাস্তব ও উল্টো","অবাস্তব ও সোজা","বাস্তব ও সোজা","সবসময় ছোট"],
 answer:1,
 explain:"সমতল দর্পণে প্রতিবিম্ব অবাস্তব, সোজা এবং বস্তুর সমান আকারের হয়।"
}

];

let quizQuestions=[];
let current=0;
let score=0;
let answered=false;

function startQuiz(){
 const chapter=document.getElementById("chapter").value;
 const model=document.getElementById("model").value;

 quizQuestions=questions.filter(item=>
   (chapter==="all" || item.chapter===chapter) &&
   (model==="all" || item.model===model)
 );

 if(quizQuestions.length===0){
   alert("এই বিভাগে এখনও প্রশ্ন যোগ করা হয়নি। অন্য বিভাগ বেছে নাও।");
   return;
 }

 quizQuestions.sort(()=>Math.random()-0.5);
 current=0;
 score=0;

 document.getElementById("home").style.display="none";
 document.getElementById("result").style.display="none";
 document.getElementById("quiz").style.display="block";
 showQuestion();
}

function showQuestion(){
 answered=false;
 const item=quizQuestions[current];

 document.getElementById("counter").innerText=
  "প্রশ্ন "+(current+1)+" / "+quizQuestions.length;

 document.getElementById("bar").style.width=
  ((current+1)/quizQuestions.length*100)+"%";

 document.getElementById("modelName").innerText=
  item.model==="RM" ? "📘 Roy & Martin Model" : "📗 WBBSE Model";

 document.getElementById("question").innerText=item.q;

 const area=document.getElementById("options");
 area.innerHTML="";

 item.options.forEach((option,index)=>{
   const btn=document.createElement("button");
   btn.className="option";
   btn.innerText=String.fromCharCode(65+index)+". "+option;
   btn.onclick=()=>checkAnswer(index);
   area.appendChild(btn);
 });

 const feedback=document.getElementById("feedback");
 feedback.style.display="none";
 feedback.className="";
 document.getElementById("next").style.display="none";
}

function checkAnswer(selected){
 if(answered)return;
 answered=true;

 const item=quizQuestions[current];
 const buttons=document.querySelectorAll(".option");
 const feedback=document.getElementById("feedback");

 buttons.forEach((btn,index)=>{
   btn.disabled=true;
   if(index===item.answer)btn.classList.add("correct");
   if(index===selected && selected!==item.answer)btn.classList.add("wrong");
 });

 if(selected===item.answer){
   score++;
   feedback.className="good";
   feedback.innerHTML="🎉 সাবাশ! একদম সঠিক উত্তর!<br>"+item.explain;
   playSound(true);
 }else{
   feedback.className="bad";
   feedback.innerHTML="আবার চেষ্টা করবে! সঠিক উত্তর: "+
     item.options[item.answer]+"<br>"+item.explain;
   playSound(false);
 }

 feedback.style.display="block";
 document.getElementById("next").style.display="block";
 document.getElementById("next").innerText=
  current===quizQuestions.length-1 ? "ফলাফল দেখো" : "পরের প্রশ্ন →";
}

function nextQuestion(){
 current++;
 if(current<quizQuestions.length){
   showQuestion();
 }else{
   showResult();
 }
}

function showResult(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="block";

 document.getElementById("score").innerText=
  score+" / "+quizQuestions.length;

 const percentage=Math.round(score/quizQuestions.length*100);
 document.getElementById("message").innerText=
  percentage>=80 ? "অসাধারণ! তুমি সত্যিই একজন সুপারস্টার! 🌟":
  percentage>=50 ? "খুব ভালো! আরও একটু অনুশীলন করো।":
  "চিন্তা নেই! আবার চেষ্টা করো। তুমি পারবে! 💪";
}

function goHome(){
 document.getElementById("result").style.display="none";
 document.getElementById("home").style.display="block";
}

function speakQuestion(){
 if(!("speechSynthesis" in window)){
   alert("এই ব্রাউজারে বাংলা ভয়েস সুবিধা নেই।");
   return;
 }
 const item=quizQuestions[current];
 const textToSpeak=item.q+". "+item.options.join(". ");
 const speech=new SpeechSynthesisUtterance(textToSpeak);
 speech.lang="bn-IN";
 speech.rate=0.9;
 speechSynthesis.cancel();
 speechSynthesis.speak(speech);
}

function playSound(correct){
 try{
   const audio=new (window.AudioContext||window.webkitAudioContext)();
   const oscillator=audio.createOscillator();
   const gain=audio.createGain();
   oscillator.connect(gain);
   gain.connect(audio.destination);
   oscillator.type="sine";
   oscillator.frequency.value=correct?880:260;
   gain.gain.value=0.08;
   oscillator.start();
   oscillator.stop(audio.currentTime+0.18);
 }catch(e){}
}
</script>
</body>
</html>
