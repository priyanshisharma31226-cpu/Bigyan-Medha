<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অষ্টম শ্রেণি - পরিবেশ ও বিজ্ঞান কুইজ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #00796b;
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .question {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #f1f8e9;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
        }
        .options button:hover {
            background: #dcedc8;
            border-color: #8bc34a;
        }
        .options button.correct {
            background: #c8e6c9 !important;
            border-color: #4caf50 !important;
            color: #1b5e20;
        }
        .options button.wrong {
            background: #ffcdd2 !important;
            border-color: #f44336 !important;
            color: #b71c1c;
        }
        #next-btn, #restart-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        #next-btn:hover, #restart-btn:hover {
            background: #004d40;
        }
        .score-card {
            text-align: center;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-box">
    <h1>অষ্টম শ্রেণি: পরিবেশ ও বিজ্ঞান কুইজ</h1>
    <div id="question-container">
        <div class="question" id="question-text">প্রশ্ন লোড হচ্ছে...</div>
        <div class="options" id="options-container"></div>
    </div>
    <button id="next-btn" onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>
</div>

<script>
    const quizData = [
        {
            question: "১. তাপ প্রয়োগে সাধারণত পদার্থের আয়তন কী হয়?",
            options: ["কমে যায়", "বেড়ে যায়", "একই থাকে", "প্রথমে বাড়ে পরে কমে"],
            answer: 1
        },
        {
            question: "২. কোন কোষ অঙ্গাণুকে 'কোষের পাওয়ার হাউস' বলা হয়?",
            options: ["রাইবোজোম", "মাইটোকন্ড্রিয়া", "গলগি বডি", "নিউক্লিয়াস"],
            answer: 1
        },
        {
            question: "৩. বায়ুমণ্ডলে সবচেয়ে বেশি পরিমাণে কোন গ্যাসটি থাকে?",
            options: ["অক্সিজেন", "নাইট্রোজেন", "কার্বন ডাইঅক্সাইড", "আর্গন"],
            answer: 1
        },
        {
            question: "৪. জলের অণুতে হাইড্রোজেন ও অক্সিজেনের পরমাণুর অনুপাত কত?",
            options: ["১:২", "২:১", "১:১", "২:২"],
            answer: 1
        },
        {
            question: "৫. মরিচা পড়ার জন্য নিচের কোন দুটি উপাদান আবশ্যিক?",
            options: ["জল ও অক্সিজেন", "নাইট্রোজেন ও হিলিয়াম", "হাইড্রোজেন ও কার্বন ডাইঅক্সাইড", "শুধুমাত্র জল"],
            answer: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
        nextBtn.style.display = "none";
        let currentQuiz = quizData[currentQuestionIndex];
        questionText.innerText = currentQuiz.question;
        optionsContainer.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedButton) {
        let currentQuiz = quizData[currentQuestionIndex];
        const buttons = optionsContainer.getElementsByTagName("button");

        if (selectedIndex === currentQuiz.answer) {
            selectedButton.classList.add("correct");
            score++;
        } else {
            selectedButton.classList.add("wrong");
            buttons[currentQuiz.answer].classList.add("correct");
        }

        for (let btn of buttons) {
            btn.disabled = true;
        }

        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById("quiz-box").innerHTML = `
                <div class="score-card">
                    <h1>কুইজ সমাপ্ত! 🎉</h1>
                    <p>আপনার মোট স্কোর: <b>${score}</b> / ${quizData.length}</p>
                    <button id="restart-btn" style="display:block;" onclick="location.reload()">আবার খেলুন</button>
                </div>
            `;
        }
    }

    loadQuestion();
</script>

</body>
</html>
